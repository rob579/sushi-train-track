<style>
/* the rounded font is bundled with the app (fonts/), so nothing is loaded from other websites */
@font-face{font-family:'M PLUS Rounded 1c';font-style:normal;font-display:swap;font-weight:400;src:url(fonts/m-plus-rounded-1c-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'M PLUS Rounded 1c';font-style:normal;font-display:swap;font-weight:500;src:url(fonts/m-plus-rounded-1c-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'M PLUS Rounded 1c';font-style:normal;font-display:swap;font-weight:800;src:url(fonts/m-plus-rounded-1c-latin-800-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'M PLUS Rounded 1c';font-style:normal;font-display:swap;font-weight:400;src:url(fonts/m-plus-rounded-1c-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'M PLUS Rounded 1c';font-style:normal;font-display:swap;font-weight:500;src:url(fonts/m-plus-rounded-1c-latin-ext-500-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'M PLUS Rounded 1c';font-style:normal;font-display:swap;font-weight:800;src:url(fonts/m-plus-rounded-1c-latin-ext-800-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{
  --bar:60px;   /* height of the docked restaurant-name bar */
  --tab:34px;   /* height of the pull-up tab */
  --nori:#0f2a2b;        /* page background */
  --belt:#183a3b;        /* raised surfaces */
  --belt-2:#21494a;
  --rice:#f4efe3;        /* main text */
  --mute:#93b0ab;        /* secondary text */
  --price:#86efac;       /* totals and prices: light green */
  --wasabi:#b9dc6a;      /* primary actions */
  --danger:#ff8a78;
  --font:'M PLUS Rounded 1c', ui-rounded, 'Hiragino Maru Gothic ProN', system-ui, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:var(--nori);color:var(--rice);font-family:var(--font);font-size:16px;
  overscroll-behavior:none;touch-action:manipulation;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{position:relative;overflow:hidden;height:100%;display:flex;flex-direction:column;max-width:1100px;margin:0 auto;
  padding-top:env(safe-area-inset-top,0px)}

/* ---------- shared ---------- */
.btn{background:var(--belt-2);border-radius:14px;padding:12px 18px;font-weight:500}
.btn.primary{background:var(--wasabi);color:#1c2a0a;font-weight:800}
.btn.danger{color:var(--danger)}
.btn:active{transform:scale(.97)}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--belt)}
.icon-btn svg{width:22px;height:22px;stroke:var(--rice);fill:none;stroke-width:2;stroke-linecap:round}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
.narrow{width:100%;max-width:640px;margin:0 auto}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:16px}
h1{font-size:26px;font-weight:800;margin:0}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 16px}
.topbar h1{flex:1}
.muted{color:var(--mute)}
input[type=text],input[type=number]{
  background:var(--belt);border:2px solid transparent;border-radius:12px;padding:12px 14px;width:100%;min-width:0;
  outline:none}
input:focus{border-color:var(--wasabi)}
input::placeholder{color:#6d8d88}

/* ---------- landing page ---------- */
.landing{min-height:100%;display:flex;flex-direction:column;justify-content:space-between;gap:28px;
  padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.hero-title{font-size:clamp(34px,10vw,52px);font-weight:800;line-height:1.05;text-align:center;margin:6px 0 0;letter-spacing:-.5px}
.hero-title span{color:var(--wasabi)}
.belt{position:relative;overflow:hidden;height:30px;margin:18px 0 0;border-block:3px solid var(--belt-2)}
.belt::before{content:'';position:absolute;top:0;bottom:0;left:-48px;width:calc(100% + 96px);
  background:repeating-linear-gradient(90deg,transparent 0 16px,var(--belt-2) 16px 24px);
  transform:skewX(-25deg);animation:belt 1.4s linear infinite}
@keyframes belt{to{transform:skewX(-25deg) translateX(24px)}}
.hero-plates{display:block;width:100%;max-width:400px;height:auto;margin:22px auto 0}
.pick-label{display:block;font-size:24px;font-weight:800;margin:0 0 12px 2px}
.select-wrap{position:relative}
.select-wrap select{appearance:none;-webkit-appearance:none;width:100%;background:var(--belt);color:var(--rice);
  border:2px solid var(--belt-2);border-radius:16px;padding:17px 52px 17px 18px;font-size:19px;font-family:var(--font);
  color-scheme:dark;outline:none;text-overflow:ellipsis}
.select-wrap select:focus{border-color:var(--wasabi)}
.select-wrap select option{background:var(--belt);color:var(--rice)}
.select-wrap::after{content:'';position:absolute;right:22px;top:50%;width:10px;height:10px;
  border-right:3px solid var(--rice);border-bottom:3px solid var(--rice);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.picker .intro{color:var(--mute);line-height:1.5;margin:0 2px 16px;font-size:17px}
.ver{text-align:center;color:var(--mute);opacity:.55;font-size:12px;margin-top:18px}
.btn.big{width:100%;padding:18px;font-size:21px;border-radius:18px}
@media (prefers-reduced-motion:reduce){.belt::before{animation:none}}

/* ---------- bill screen ---------- */
.bill-head{display:flex;align-items:center;gap:12px;padding:10px 16px 6px}
.total{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;line-height:1}
.total .lbl{color:var(--mute);font-size:20px}
.total b{white-space:nowrap;font-size:50px;font-weight:800;color:var(--price);font-variant-numeric:tabular-nums;letter-spacing:-.5px;display:inline-block}
.total b.bump{animation:bump .25s ease-out}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
.banner{margin:6px 16px 0;padding:10px 14px;background:var(--danger);color:#3a0f08;border-radius:14px;
  display:flex;align-items:center;justify-content:space-between;font-weight:800}
.banner button{background:rgba(0,0,0,.15);border-radius:10px;padding:6px 12px;font-weight:800}
.plates{--rg:22px;--pv:32px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--rg) 16px;padding:14px 16px 18px}
@media (max-width:440px){.plates{--rg:14px;--pv:26px;grid-template-columns:repeat(2,1fr);gap:var(--rg) 10px;padding:12px 12px 14px}}
.plate-btn{padding:0;display:flex;flex-direction:column;align-items:center;gap:8px;user-select:none;-webkit-user-select:none}
.plate{
  --c:#fff;--ink:#111;
  width:100%;max-width:190px;aspect-ratio:1;border-radius:50%;position:relative;
  display:grid;place-items:center;
  background:
    radial-gradient(circle at 50% 50%, transparent 0 36%, rgba(0,0,0,.22) 36% 38.5%, rgba(255,255,255,.3) 38.5% 41%, transparent 41%),
    radial-gradient(circle at 35% 28%, rgba(255,255,255,.35), transparent 45%),
    var(--c);
  box-shadow:0 7px 0 rgba(0,0,0,.35), inset 0 0 0 4px rgba(255,255,255,.2);
  transition:transform .08s;
}
.plate-btn:active .plate{transform:translateY(3px) scale(.97);box-shadow:0 3px 0 rgba(0,0,0,.35), inset 0 0 0 4px rgba(255,255,255,.2)}
.plate .n{font-size:52px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
.plate .n.zero{opacity:.35}
.plate.pop{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.09)}100%{transform:scale(1)}}
.plate .price{position:absolute;left:0;right:0;bottom:7%;text-align:center;font-weight:800;font-size:15px;line-height:1;
  color:var(--ink);font-variant-numeric:tabular-nums;pointer-events:none}
.removing .plate-btn.has .plate{animation:wiggle .35s ease-in-out infinite;outline:3px dashed var(--danger);outline-offset:4px}
.removing .plate-btn.has:nth-child(even) .plate{animation-delay:-.17s}
.removing .plate-btn:not(.has){opacity:.3;pointer-events:none}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@media (prefers-reduced-motion:reduce){
  .removing .plate-btn.has .plate{animation:none}
  .total b.bump,.plate.pop{animation:none}
}
.extras{padding:6px 0 calc(16px + env(safe-area-inset-bottom,0px))}
.extras form{display:flex;gap:8px}
.extras .amt{width:92px;flex:none;position:relative}
#xdesc{padding-left:12px;padding-right:8px}
.extras .amt span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mute)}
.extras .amt input{padding-left:28px}
.extras .safe{height:calc(14px + env(safe-area-inset-bottom,0px))}
.extras .add{flex:none;background:var(--wasabi);color:#1c2a0a;border-radius:12px;padding:0 14px;font-weight:800}
.extras .add:active{transform:scale(.96)}
.extras label{display:block;font-size:15px;color:var(--mute);margin:0 0 8px 2px}
.venue{height:calc(var(--bar) + env(safe-area-inset-bottom,0px));box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px);display:flex;align-items:center;font-weight:800;color:var(--rice);font-size:26px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.dock-space{flex:none;height:calc(var(--bar) + var(--tab) + env(safe-area-inset-bottom,0px))}
.dock-scrim{position:absolute;inset:0;z-index:5;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .3s}
.dock-scrim.on{opacity:1;pointer-events:auto}
.dock{position:absolute;left:0;right:0;bottom:var(--kb,0px);z-index:6;margin-inline:auto;width:min(640px,calc(100% - 24px));
  background:var(--belt);border-radius:22px 22px 0 0;padding:0 16px;
  box-shadow:0 -10px 28px rgba(0,0,0,.5),0 -1px 0 rgba(255,255,255,.07);
  transform:translateY(calc(100% - var(--bar) - env(safe-area-inset-bottom,0px)));
  transition:transform .34s cubic-bezier(.2,.85,.25,1),bottom .2s ease-out}
html.kb .extras{padding-bottom:16px}
.dock.open{transform:translateY(0)}
.dock-tab{position:absolute;left:50%;bottom:calc(100% - 1px);translate:-50% 0;height:calc(var(--tab) + 1px);padding:0 20px;
  display:flex;align-items:center;gap:10px;background:var(--belt);border-radius:16px 16px 0 0;
  font-weight:800;font-size:15px;white-space:nowrap;box-shadow:0 -6px 16px rgba(0,0,0,.35),0 -1px 0 rgba(255,255,255,.07)}
.dock-tab::before{content:'';position:absolute;inset:-10px -10px 0}
.dock-tab i{width:8px;height:8px;border-left:2.5px solid var(--wasabi);border-top:2.5px solid var(--wasabi);
  transform:translateY(2px) rotate(45deg);transition:transform .3s}
.dock.open .dock-tab i{transform:translateY(-2px) rotate(225deg)}
@media (prefers-reduced-motion:reduce){.dock,.dock-scrim,.dock-tab i{transition:none}}

/* Size plates from the space available: up to 3 rows fit without scrolling.
   Needs container query units, so it is skipped on older browsers. */
@supports (height:1cqh){
  .scroll.fit{container-type:size}
  .plates{--cap:max(96px, calc((100cqh - var(--pv) - (var(--rows,3) - 1) * var(--rg)) / var(--rows,3) - 2px))}
  .plate{width:min(100%,190px,var(--cap));container-type:inline-size}
  .plate .n{font-size:31cqw}
  .plate .price{font-size:calc(var(--pf,10.5) * 1cqw)}
}

/* ---------- add-item suggestions ---------- */
.formwrap{position:relative}
.suggest{position:absolute;left:0;right:0;bottom:calc(100% + 8px);max-height:min(40vh,320px);overflow-y:auto;
  background:var(--belt-2);border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.45);padding:6px;z-index:5}
.suggest[hidden]{display:none}
.suggest button{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:13px 12px;border-radius:12px}
.suggest button:active{background:rgba(255,255,255,.08)}
.suggest b{font-variant-numeric:tabular-nums;color:var(--price)}
.suggest small{color:var(--mute);font-size:13px;align-self:center;white-space:nowrap}
.dwrap{position:relative;flex:1;min-width:0}
.edit-suggest{bottom:auto;top:calc(100% + 6px);left:0;right:auto;width:min(340px,calc(100vw - 32px));z-index:8}
.edit-suggest.up{top:auto;bottom:calc(100% + 6px)}
.suggest .hint{padding:10px 12px;color:var(--mute);font-size:14px}
#update-banner{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);z-index:30;
  display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:14px;background:var(--wasabi);color:#1c2a0a;
  font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.45);white-space:nowrap}
#update-banner button{border-radius:10px;padding:8px 12px;font-weight:800;background:rgba(0,0,0,.16)}
#update-banner .x{padding:8px 10px;font-size:18px;line-height:1}
/* ---------- editions: premium pill, locks, upgrade sheet ---------- */
.pro{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;background:var(--wasabi);color:#1c2a0a;
  font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;vertical-align:middle;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--mute);width:100%;margin-top:10px;font-weight:500;font-size:15px}
.select-like{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;
  background:var(--belt);border:2px solid var(--belt-2);border-radius:16px;padding:17px 18px;font-size:19px;color:var(--mute)}
.menu .up-entry{color:var(--wasabi);font-weight:800}
.suggest small.pro-note{color:var(--wasabi)}
.plate-btn.locked .plate{filter:grayscale(.8) brightness(.72)}
.plate .n.lock svg{width:40px;height:40px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
@supports (height:1cqh){ .plate .n.lock svg{width:30cqw;height:30cqw} }
#upgrade{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
#upgrade .up-scrim{position:absolute;inset:0;background:rgba(0,0,0,.6)}
#upgrade .up-card{position:relative;width:min(520px,100%);max-height:92%;overflow-y:auto;background:var(--belt);
  border-radius:24px 24px 0 0;padding:24px 20px calc(20px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -12px 40px rgba(0,0,0,.5);animation:upIn .28s ease-out}
@keyframes upIn{from{transform:translateY(40px);opacity:0}}
#upgrade h2{margin:0 0 6px;font-size:26px;font-weight:800}
#upgrade .up-why{margin:0 0 14px;color:var(--wasabi);font-weight:500;line-height:1.4}
#upgrade ul{list-style:none;margin:0 0 14px;padding:0}
#upgrade li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;line-height:1.35}
#upgrade li::before{content:'';flex:none;width:7px;height:12px;margin:3px 4px 0 3px;border:solid var(--wasabi);border-width:0 3px 3px 0;transform:rotate(40deg)}
#upgrade .small{font-size:14px;margin:8px 2px}
#upgrade .up-msg{min-height:20px;margin:6px 2px;color:var(--danger);font-size:14px}
#upgrade .up-msg.ok{color:var(--price)}
#upgrade .up-row{display:flex;gap:10px;margin-top:10px}
#upgrade .up-row .btn{flex:1}
#upgrade .btn[disabled]{opacity:.6;pointer-events:none}
@media (prefers-reduced-motion:reduce){#upgrade .up-card{animation:none}}
/* itemised bill: a quiet icon for extras (not a button) */
.line .chip.extra{background:none;box-shadow:none;color:var(--mute);display:grid;place-items:center}
.line .chip.extra svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* tapping the collapsed drawer (or its name) opens it */
.venue{cursor:pointer}
.dock:not(.open){cursor:pointer}
/* the empty dotted circle that adds a plate */
.plate-btn.add-plate .plate{background:none;box-shadow:none;border:3px dashed rgba(147,176,171,.65)}
.plate-btn.add-plate:active .plate{box-shadow:none}
.plate .plus{font-size:44px;line-height:1;color:var(--mute);font-weight:500}
@supports (height:1cqh){ .plate .plus{font-size:34cqw} }
.plate-btn{-webkit-touch-callout:none}
/* round plate colour button in the setup screen */
.cdot{width:48px;height:48px;border-radius:50%;flex:none;background:var(--c);box-shadow:inset 0 0 0 3px rgba(255,255,255,.3)}
.cdot:active{transform:scale(.95)}
/* modal dialogs */
#modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
#modal .m-scrim{position:absolute;inset:0;background:rgba(0,0,0,.62)}
#modal .m-card{position:relative;width:min(420px,100%);max-height:92%;overflow-y:auto;background:var(--belt);border-radius:24px;
  padding:22px 20px 18px;box-shadow:0 20px 50px rgba(0,0,0,.55);animation:upIn .22s ease-out}
#modal h2{margin:0 0 4px;font-size:24px;font-weight:800}
#modal .m-sub{margin:0 0 14px;color:var(--mute);line-height:1.4}
#modal .m-row{display:flex;gap:10px;margin-top:18px}
#modal .m-row .btn{flex:1}
#modal .btn.danger-fill{background:var(--danger);color:#3a0f08;font-weight:800}

<body>
<div id="app"></div>

<script>
/* ============ config ============ */
const BUILD = '12 Oct 2026 · menu items handle';   // shown on the landing page so you can tell which copy is running
const BUILD_ID = 'dev';   // stamped with the git commit by update.sh
const KEY = 'plateTally.v1';
const SWATCHES = ['#e5484d','#f5a524','#f2d74a','#4cb782','#3e8ef7','#8b5cf6','#e8e2d4','#2b2b2b'];

/* ============ state ============ */
const fresh = () => ({ restaurants: [], bills: {}, current: null });
function load(){ try { return Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY))); } catch { return fresh(); } }
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
let S = load();
const ui = { view: 'pick', menu: false, removing: false, dock: false, draft: null };

const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const rest = () => S.restaurants.find(r => r.id === S.current);

/* ============ currency and number formatting ============
   Every restaurant has its own currency. Prices are stored as hundredths of the main unit
   (so 4.80 is 480, and 450 yen is 45000) and shown through Intl, so the symbol, its position and the
   decimal/thousands marks follow the phone's language and region. */
const LOCALE = (() => {   // the phone's language tag, ignoring anything the browser cannot use
  for (const l of [...(navigator.languages || []), navigator.language]) {
    try { if (l) return Intl.getCanonicalLocales(l)[0]; } catch {}
  }
  return 'en-US';
})();
const REGION_CURRENCY = {
  AU:'AUD', NZ:'NZD', US:'USD', CA:'CAD', GB:'GBP', IE:'EUR', DE:'EUR', FR:'EUR', ES:'EUR', IT:'EUR', NL:'EUR', BE:'EUR',
  AT:'EUR', PT:'EUR', FI:'EUR', GR:'EUR', LU:'EUR', SK:'EUR', SI:'EUR', EE:'EUR', LV:'EUR', LT:'EUR', MT:'EUR', CY:'EUR', HR:'EUR',
  JP:'JPY', CN:'CNY', HK:'HKD', TW:'TWD', KR:'KRW', SG:'SGD', MY:'MYR', TH:'THB', ID:'IDR', PH:'PHP', VN:'VND', IN:'INR',
  CH:'CHF', SE:'SEK', NO:'NOK', DK:'DKK', PL:'PLN', CZ:'CZK', HU:'HUF', AE:'AED', SA:'SAR', IL:'ILS', TR:'TRY', ZA:'ZAR',
  BR:'BRL', MX:'MXN', AR:'ARS', CL:'CLP', CO:'COP', PE:'PEN'
};
const CURRENCIES = ['AED','ARS','AUD','BRL','CAD','CHF','CLP','CNY','COP','CZK','DKK','EUR','GBP','HKD','HUF','IDR','ILS','INR',
  'JPY','KRW','MXN','MYR','NOK','NZD','PEN','PHP','PLN','SAR','SEK','SGD','THB','TRY','TWD','USD','VND','ZAR'];
function defaultCurrency(){
  let region = '';
  try { region = new Intl.Locale(LOCALE).maximize().region || ''; } catch {}
  return REGION_CURRENCY[region] || 'USD';
}
/* Short symbols (€, ¥, £) are used wherever there is one. Some locales, such as Australian English, would
   otherwise spell foreign currencies as codes ("EUR 3.00"). Dollar currencies other than the phone's own,
   and the yuan, keep a longer form ("US$", "CN¥") because a bare "$" or "¥" would be ambiguous. */
const _nf = {};
const mkNf = (cur, display) => {
  try { return new Intl.NumberFormat(LOCALE, { style: 'currency', currency: cur, currencyDisplay: display }); }
  catch { return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', currencyDisplay: display }); }
};
/* if a locale still spells a currency as its bare code, use the conventional symbol instead */
const SYMBOL_FALLBACK = { USD:'US$', CAD:'CA$', NZD:'NZ$', AUD:'A$', HKD:'HK$', SGD:'S$', TWD:'NT$', MXN:'MX$', CNY:'CN¥', EUR:'€', GBP:'£',
  JPY:'¥', KRW:'₩', INR:'₹', ILS:'₪', VND:'₫', PHP:'₱', THB:'฿', BRL:'R$', TRY:'₺', PLN:'zł', CZK:'Kč', SEK:'kr', NOK:'kr', DKK:'kr' };
function withFallback(f, cur){
  const sym = SYMBOL_FALLBACK[cur], part = f.formatToParts(0).find(x => x.type === 'currency');
  if (!sym || !part || part.value !== cur) return f;
  const tight = !/\p{L}$/u.test(sym);   // "US$4.80" and "€4.80" read better without the gap that goes with "USD 4.80"
  const swap = parts => parts.flatMap((p, i) => p.type === 'currency' ? [{ ...p, value: sym }]
    : (tight && p.type === 'literal' && i > 0 && parts[i - 1].type === 'currency' && /^\s+$/.test(p.value)) ? [] : [p]);
  return { format: v => swap(f.formatToParts(v)).map(p => p.value).join(''), formatToParts: v => swap(f.formatToParts(v)), resolvedOptions: () => f.resolvedOptions() };
}
const narrowOf = cur => { const p = mkNf(cur, 'narrowSymbol').formatToParts(0).find(x => x.type === 'currency'); return p ? p.value : cur; };
function nf(cur){
  if (_nf[cur]) return _nf[cur];
  const home = defaultCurrency(), narrow = narrowOf(cur);
  const ambiguous = cur !== home && (narrow === '$' || narrow === narrowOf(home) || cur === 'CNY');
  return (_nf[cur] = withFallback(mkNf(cur, ambiguous ? 'symbol' : 'narrowSymbol'), cur));
}
const curOf = r => (r && r.currency) || defaultCurrency();       // restaurants saved before currencies existed
const digitsOf = cur => nf(cur).resolvedOptions().maximumFractionDigits === 0 ? 0 : 2;
const money = (c, r = rest()) => nf(curOf(r)).format(c / 100);   // "$4.80", "4,80 €", "¥450" ...
const symOf = cur => { const p = nf(cur).formatToParts(0).find(x => x.type === 'currency'); return p ? p.value : cur; };
const symPad = cur => Math.round(20 + symOf(cur).length * 8.5);   // room for the symbol inside a price box
/* a plain number for an input box, in the phone's own style (4.80, 4,80 or 450) */
const plain = (c, cur) => new Intl.NumberFormat(LOCALE, { minimumFractionDigits: digitsOf(cur), maximumFractionDigits: digitsOf(cur),
  useGrouping: false, numberingSystem: 'latn' }).format(c / 100);
/* read what someone typed: accepts 4.50 / 4,50 / 1,234.50 / 1.234,50 / 1,200 (yen) and ignores symbols */
function toCents(v, cur){
  let t = String(v).trim();
  if (!t || /-/.test(t)) return null;
  t = t.replace(/[٠-٩]/g, d => d.charCodeAt(0) - 0x660).replace(/[۰-۹]/g, d => d.charCodeAt(0) - 0x6F0)
       .replace(/٫/g, '.').replace(/٬/g, ',').replace(/[^\d.,]/g, '');
  if (!/\d/.test(t)) return null;
  const digits = digitsOf(cur), lc = t.lastIndexOf(','), ld = t.lastIndexOf('.');
  const groups = sep => t.split(sep).slice(1).every(x => x.length === 3);
  if (lc > -1 && ld > -1) t = lc > ld ? t.replace(/\./g, '').replace(',', '.') : t.replace(/,/g, '');
  else if (lc > -1) t = (t.split(',').length > 2 || (digits === 0 && groups(','))) ? t.replace(/,/g, '') : t.replace(',', '.');
  else if (ld > -1 && (t.split('.').length > 2 || (digits === 0 && groups('.')))) t = t.replace(/\./g, '');
  const n = parseFloat(t);
  if (!isFinite(n) || n < 0) return null;
  return digits === 0 ? Math.round(n) * 100 : Math.round(n * 100);
}
function currencyLabel(c){
  let n = ''; try { n = new Intl.DisplayNames([LOCALE], { type: 'currency' }).of(c); } catch {}
  return c + (n && n !== c ? ' · ' + n : '');
}
function currencyOptions(sel){
  let names = null;
  try { names = new Intl.DisplayNames([LOCALE], { type: 'currency' }); } catch {}
  return [...new Set([...CURRENCIES, sel])].sort().map(c => {
    let n = ''; try { n = names ? names.of(c) : ''; } catch {}
    return `<option value="${c}"${c === sel ? ' selected' : ''}>${c}${n && n !== c ? ' · ' + esc(n) : ''}</option>`;
  }).join('');
}
const billOf = id => (S.bills[id] ||= { counts: {}, extras: [] });
function totalOf(r){
  const b = S.bills[r.id]; if (!b) return 0;
  return r.plates.reduce((s, p) => s + (b.counts[p.id] || 0) * p.price, 0) + b.extras.reduce((s, e) => s + e.price, 0);
}
function inkFor(hex){
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) > 165 ? '#1b1b1b' : '#ffffff';
}
const ICON = {
  menu:'<svg viewBox="0 0 24 24" style="fill:var(--rice);stroke:none"><circle cx="12" cy="5" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="19" r="2.2"/></svg>',
  lock:'<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  cup:'<svg viewBox="0 0 24 24"><path d="M5 10h11v4.5a4.5 4.5 0 0 1-4.5 4.5h-2A4.5 4.5 0 0 1 5 14.5z"/><path d="M16 12h1.4a2.3 2.3 0 0 1 0 4.6H16"/><path d="M8.5 4.5c0 1.4 1.4 1.4 1.4 2.8M12.5 4.5c0 1.4 1.4 1.4 1.4 2.8"/></svg>',
  back:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  pencil:'<svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/></svg>',
};
/* ============ editions: free and premium ============
   - On the website (a normal browser, or the installed website app) everything is unlocked.
   - Inside the Google Play app (it opens the site with ?app=play) the app starts on the free tier, and
     Premium is unlocked by a one-time purchase through Google Play Billing.
   - To test in a browser, add ?edition=free or ?edition=premium to the address (ignored in the Play app;
     ?edition=reset goes back to normal). */
const FREE_RESTAURANTS = 1, FREE_PLATES = 5, PREMIUM_SKU = 'premium_unlock';
const IN_PLAY_APP = (() => {
  try {
    const q = new URLSearchParams(location.search);
    if (q.get('app') === 'play' || document.referrer.startsWith('android-app://')) sessionStorage.setItem('stt-app', 'play');
    return sessionStorage.getItem('stt-app') === 'play';
  } catch { return false; }
})();
let PREVIEW = (() => {
  try {
    if (IN_PLAY_APP) return null;
    const e = new URLSearchParams(location.search).get('edition');
    if (e === 'free' || e === 'premium') sessionStorage.setItem('stt-edition', e);
    if (e === 'reset') sessionStorage.removeItem('stt-edition');
    return sessionStorage.getItem('stt-edition');
  } catch { return null; }
})();
const ENT_KEY = 'plateTally.entitlement.v1';
const ENT = { purchased: (() => { try { return JSON.parse(localStorage.getItem(ENT_KEY)).purchased === true; } catch { return false; } })() };
const isPremium = () => IN_PLAY_APP ? ENT.purchased : PREVIEW !== 'free';
const editionLabel = () => IN_PLAY_APP ? (ENT.purchased ? 'Premium' : 'Free') : PREVIEW === 'free' ? 'Free (preview)' : PREVIEW === 'premium' ? 'Premium (preview)' : 'Website';

let _billing = null;
async function getBilling(){
  if (_billing) return _billing;
  if (!IN_PLAY_APP || !('getDigitalGoodsService' in window)) return null;
  try { _billing = await window.getDigitalGoodsService('https://play.google.com/billing'); } catch { _billing = null; }
  return _billing;
}
function setPurchased(v){
  const changed = ENT.purchased !== v;
  ENT.purchased = v;
  try { localStorage.setItem(ENT_KEY, JSON.stringify({ purchased: v, at: Date.now() })); } catch {}
  return changed;
}
/* ---- acknowledging purchases ----
   Google refunds a purchase that is never acknowledged (after about 3 days, and after about 3 minutes for test
   purchases). The browser Billing API cannot do this for one-time purchases, so a small server function
   (/api/acknowledge) does it, and anything that fails is remembered and retried the next time the app opens or
   comes back to the front. */
const ACKED_KEY = 'plateTally.acked.v1', PENDING_KEY = 'plateTally.pending.v1';
const readList = k => { try { const v = JSON.parse(localStorage.getItem(k)); return Array.isArray(v) ? v : []; } catch { return []; } };
const writeList = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v.slice(-10))); } catch {} };
const isAcked = t => readList(ACKED_KEY).includes(t);
function markAcked(t){ if (!isAcked(t)) writeList(ACKED_KEY, [...readList(ACKED_KEY), t]); writeList(PENDING_KEY, readList(PENDING_KEY).filter(x => x !== t)); }
function addPending(t){ if (!readList(PENDING_KEY).includes(t)) writeList(PENDING_KEY, [...readList(PENDING_KEY), t]); }
function dropPending(t){ writeList(PENDING_KEY, readList(PENDING_KEY).filter(x => x !== t)); }
async function ackOnServer(token){
  if (isAcked(token)) return true;
  let timer;
  try {
    const ctl = new AbortController(); timer = setTimeout(() => ctl.abort(), 12000);
    const res = await fetch('/api/acknowledge', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sku: PREMIUM_SKU, purchaseToken: token }), signal: ctl.signal });
    const out = await res.json().catch(() => ({}));
    if (res.ok && out.ok) { markAcked(token); return true; }
    if (out.reason === 'invalid-token' || out.reason === 'not-purchased') { dropPending(token); return false; }   // nothing to retry
  } catch {} finally { clearTimeout(timer); }
  addPending(token);   // try again later
  return false;
}
async function acknowledgePurchase(svc, token){
  if (svc && typeof svc.acknowledge === 'function') {   // some older browsers still have this; current ones do not
    try { await svc.acknowledge(token, 'onetime'); markAcked(token); return true; } catch {}
  }
  return ackOnServer(token);
}
async function retryPendingAcks(){ for (const t of readList(PENDING_KEY).slice(0, 5)) await ackOnServer(t); }

/* ask Google Play what this person owns (also restores a purchase on a new phone or after reinstalling) */
async function refreshEntitlement(){
  const svc = await getBilling(); if (!svc) return false;
  try {
    const owned = (await svc.listPurchases()).find(p => p.itemId === PREMIUM_SKU);
    if (owned && !isAcked(owned.purchaseToken)) acknowledgePurchase(svc, owned.purchaseToken);   // not waited for
    retryPendingAcks();                                                                      // and any earlier attempt that failed
    if (setPurchased(!!owned)) { hideUpgrade(); render(); }
    return !!owned;
  } catch { return ENT.purchased; }   // offline or Play unavailable: keep what we had
}
async function buyPremium(){
  if (!IN_PLAY_APP) {   // website preview: pretend the purchase worked
    PREVIEW = 'premium'; try { sessionStorage.setItem('stt-edition', 'premium'); } catch {}
    hideUpgrade(); render(); toast('Preview: Premium unlocked (no real purchase)');
    return;
  }
  const svc = await getBilling();
  if (!svc) { upgradeMsg('Purchases are not available right now. Please try again later.'); return; }
  upgradeBusy(true); upgradeMsg('');
  let response = null, bought = false;
  try {
    let price = null;
    try { const details = await svc.getDetails([PREMIUM_SKU]); price = details && details[0] && details[0].price; } catch {}
    const request = new PaymentRequest(
      [{ supportedMethods: 'https://play.google.com/billing', data: { sku: PREMIUM_SKU } }],
      { total: { label: 'Premium', amount: { currency: price ? price.currency : 'USD', value: price ? price.value : '0' } } });   // amount is ignored by Play Billing
    response = await request.show();
    const token = response.details && response.details.purchaseToken;
    if (token) {
      bought = true;
      setPurchased(true);                    // they have paid, so unlock now
      await acknowledgePurchase(svc, token); // never throws; a failure is retried later
    } else {
      upgradeBusy(false); upgradeMsg('The purchase did not complete. If you were charged, tap "Restore purchase".');
    }
  } catch (err) {
    upgradeBusy(false);
    if (!(err && err.name === 'AbortError')) upgradeMsg('The purchase did not complete. If you were charged, tap "Restore purchase".');   // an abort is just the person closing Google's dialog
  } finally {
    // always close Google's payment screen, otherwise the app stays dimmed until it is reopened
    if (response) { try { await response.complete(bought ? 'success' : 'fail'); } catch {} }
  }
  if (bought) { hideUpgrade(); render(); toast('Premium unlocked. Thank you!'); }
}

const UP_WHY = {
  restaurants: 'Premium lets you save as many restaurants as you like.',
  plates: 'Premium lets you add more than ' + FREE_PLATES + ' plates to a restaurant.',
  items: 'Premium saves your drinks and extras so you can pick them in one tap.',
  currency: 'Premium lets you choose a currency for each restaurant.',
  generic: 'Unlock everything in Sushi Train Track with one purchase.'
};
function upgradeMsg(t, ok){ const m = document.getElementById('up-msg'); if (m) { m.textContent = t; m.classList.toggle('ok', !!ok); } }

/* ============ colour chooser (predefined colours plus a custom mixer that starts from the chosen colour) ============ */
const PALETTE = ['#e5484d','#f5a524','#f2d74a','#4cb782','#2bb5b0','#3e8ef7','#8b5cf6','#ec6fb0','#ffffff','#9aa3a8','#2b2b2b','#a2673a'];
const CC = { value: '#e5484d', custom: false };
function hexToHsl(hex){
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn, l = (mx + mn) / 2;
  let h = 0, s = 0;
  if (d) {
    s = d / (1 - Math.abs(2 * l - 1));
    h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h = (h * 60 + 360) % 360;
  }
  return { h: Math.round(h), s: Math.round(s * 100), l: Math.round(l * 100) };
}
function hslToHex(h, s, l){
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  const x = v => Math.round(v * 255).toString(16).padStart(2, '0');
  return '#' + x(f(0)) + x(f(8)) + x(f(4));
}
function ccInit(hex){ CC.value = String(hex).toLowerCase(); CC.custom = !PALETTE.includes(CC.value); }
function ccHtml(){
  const sw = PALETTE.map(c => `<button type="button" class="cc-sw" data-act="cc-pick" data-c="${c}" style="--c:${c}" aria-label="Colour ${c}"></button>`).join('');
  return `<div class="cc" id="cc">
    <div class="cc-grid">${sw}<button type="button" class="cc-sw cc-custom" data-act="cc-custom" aria-label="Custom colour"></button></div>
    <div class="cc-panel" id="cc-panel" hidden>
      <div class="cc-row"><span>Hue</span><input type="range" id="cc-h" min="0" max="360" aria-label="Hue"></div>
      <div class="cc-row"><span>Saturation</span><input type="range" id="cc-s" min="0" max="100" aria-label="Saturation"></div>
      <div class="cc-row"><span>Lightness</span><input type="range" id="cc-l" min="0" max="100" aria-label="Lightness"></div>
      <div class="cc-hex"><span>Hex code</span><input type="text" id="cc-hex" maxlength="7" autocapitalize="off" autocomplete="off" spellcheck="false" aria-label="Hex colour code"></div>
    </div>
  </div>`;
}
/* from: 'hsl' when the sliders were just moved, 'hex' when the code was just typed, nothing otherwise */
function ccRefresh(from){
  const root = document.getElementById('cc'); if (!root) return;
  const h = document.getElementById('cc-h'), sa = document.getElementById('cc-s'), li = document.getElementById('cc-l'), hx = document.getElementById('cc-hex');
  const hsl = hexToHsl(CC.value);
  if (from !== 'hsl') { h.value = hsl.h; sa.value = hsl.s; li.value = hsl.l; }   // the mixer always starts from the colour already chosen
  if (from !== 'hex') hx.value = CC.value;
  root.querySelectorAll('.cc-sw[data-c]').forEach(b => b.classList.toggle('sel', !CC.custom && b.dataset.c === CC.value));
  const cu = root.querySelector('.cc-custom');
  cu.classList.toggle('sel', CC.custom); cu.classList.toggle('has-colour', CC.custom); cu.style.setProperty('--c', CC.value);
  document.getElementById('cc-panel').hidden = !CC.custom;
  const hh = +h.value, ss = +sa.value, ll = +li.value;
  h.style.setProperty('--track', 'linear-gradient(90deg,hsl(0 ' + ss + '% ' + ll + '%),hsl(60 ' + ss + '% ' + ll + '%),hsl(120 ' + ss + '% ' + ll + '%),hsl(180 ' + ss + '% ' + ll + '%),hsl(240 ' + ss + '% ' + ll + '%),hsl(300 ' + ss + '% ' + ll + '%),hsl(360 ' + ss + '% ' + ll + '%))');
  sa.style.setProperty('--track', 'linear-gradient(90deg,hsl(' + hh + ' 0% ' + ll + '%),hsl(' + hh + ' 100% ' + ll + '%))');
  li.style.setProperty('--track', 'linear-gradient(90deg,#000,hsl(' + hh + ' ' + ss + '% 50%),#fff)');
  document.querySelectorAll('[data-cc-preview]').forEach(el => { el.style.setProperty('--c', CC.value); el.style.setProperty('--ink', inkFor(CC.value)); });
}

function saveNewPlate(){
  const r = rest(), err = document.getElementById('np-err'), input = document.getElementById('np-price');
  const c = toCents(input.value, curOf(r));
  if (c === null) { err.textContent = 'Enter the price, for example ' + plain(450, curOf(r)) + '.'; input.focus(); return; }
  if (r.plates.some(p => p.colour.toLowerCase() === CC.value)) { err.textContent = 'You already have a plate in this colour. Pick a different one.'; return; }
  if (!isPremium() && r.plates.length >= FREE_PLATES) { hideModal(); showUpgrade('plates'); return; }
  r.plates.push({ id: uid(), colour: CC.value, price: c });
  persist(); hideModal(); render(); toast('Plate added');
}

/* ============ remove one plate by pressing and holding it ============ */
const lp = { timer: null, x: 0, y: 0, suppressUntil: 0 };
function lpCancel(){ clearTimeout(lp.timer); lp.timer = null; }
function confirmRemovePlate(id){
  const r = rest(), p = r.plates.find(x => x.id === id), n = p ? (billOf(r.id).counts[id] || 0) : 0;
  if (!p || !n) { toast('None of those have been taken'); return; }
  const lbl = money(p.price, r), pf = lbl.length <= 6 ? 10.5 : lbl.length === 7 ? 9.5 : lbl.length <= 9 ? 8 : 6.8;
  showModal(`<h2>Remove one plate?</h2>

    <div class="m-preview"><div class="plate" style="--c:${p.colour};--ink:${inkFor(p.colour)};--pf:${pf}"><span class="n">${n}</span><span class="price">${esc(lbl)}</span></div></div>

document.addEventListener('pointerdown', e => {
  const b = e.target.closest && e.target.closest('.plate-btn[data-act="plate"]');
  if (!b || ui.removing || e.button > 0) return;
  lpCancel(); lp.x = e.clientX; lp.y = e.clientY;
  lp.timer = setTimeout(() => {
    lp.timer = null; lp.suppressUntil = Date.now() + 700;   // the click that follows letting go is ignored
    if (navigator.vibrate) navigator.vibrate(15);
    confirmRemovePlate(b.dataset.id);
  }, 550);
});
document.addEventListener('pointermove', e => { if (lp.timer && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 10) lpCancel(); });
['pointerup', 'pointercancel', 'dragstart'].forEach(ev => document.addEventListener(ev, lpCancel, true));
document.addEventListener('scroll', lpCancel, true);
document.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('.plate-btn')) e.preventDefault(); });

      <div class="money"><span>${esc(sym)}</span><input type="text" inputmode="decimal" enterkeyhint="next" value="${esc(p.price)}" placeholder="${ph}" style="padding-left:${pad}px" data-field="price" data-i="${i}" aria-label="Price per plate"></div>
      <button class="x" data-act="del-plate" data-i="${i}" aria-label="Remove plate">×</button>
    </div>`).join('');
  const irows = d.items.map((it, i) => `<div class="prow">
      <div class="dwrap"><input type="text" enterkeyhint="next" value="${esc(it.desc)}" placeholder="e.g. Green tea" data-field="idesc" data-i="${i}" aria-label="Item description" autocomplete="off"><div class="suggest edit-suggest" hidden></div></div>
      <div class="money" style="flex:none;width:112px"><span>${esc(sym)}</span><input type="text" inputmode="decimal" enterkeyhint="next" value="${esc(it.price)}" placeholder="${ph}" style="padding-left:${pad}px" data-field="iprice" data-i="${i}" aria-label="Item price"></div>
      <button class="x" data-act="del-item" data-i="${i}" aria-label="Remove menu item">×</button>
    </div>`).join('');
  return `<div class="screen narrow">
    <div class="topbar"><button class="icon-btn" data-act="edit-back" aria-label="Back">${ICON.back}</button>
      <h1>${d.isNew ? 'New restaurant' : 'Edit restaurant'}</h1></div>
    <div class="scroll pad">
      <div class="field-label" style="margin-top:0">Restaurant name</div>
      <input type="text" enterkeyhint="next" value="${esc(d.name)}" placeholder="e.g. Sushi Hub" data-field="name" id="rname">
      <div class="field-label">Currency</div>
      ${isPremium()
        ? `<div class="select-wrap"><select id="cur-select" aria-label="Currency">${currencyOptions(cur)}</select></div>
      ${d.isNew ? '' : '<p class="muted" style="margin:8px 2px 0;font-size:14px">Changing the currency does not convert the prices.</p>'}`
        : `<button class="select-like" data-act="upsell" data-why="currency"><span>${esc(currencyLabel(cur))}</span><span class="pro">Premium</span></button>`}
      <div class="field-label">Plates</div>
      <p class="muted" style="margin:-4px 0 12px;font-size:14px">Tap a circle to change the plate colour, then enter its price.${isPremium() ? '' : ` The free version has up to ${FREE_PLATES} plates.`}</p>
      ${rows}
      <button class="btn" style="width:100%" data-act="add-plate">Add a plate${!isPremium() && d.plates.length >= FREE_PLATES ? '<span class="pro">Premium</span>' : ''}</button>
      <div class="field-label">Menu items${isPremium() ? '' : '<span class="pro">Premium</span>'}</div>
      ${isPremium() ? `<p class="muted" style="margin:-4px 0 12px;font-size:14px">Drinks and other extras with set prices. You can pick these when adding an item to a bill.</p>
      ${irows}
      <button class="btn" style="width:100%" data-act="add-item">Add a menu item</button>`
      : `<p class="muted" style="margin:-4px 0 12px;font-size:14px">Save drinks and other extras with set prices, then pick them in one tap.${d.items.length ? ` Your ${d.items.length} saved item${d.items.length === 1 ? ' is' : 's are'} kept safe and will be back when you unlock Premium.` : ''}</p>
      <button class="btn" style="width:100%" data-act="upsell" data-why="items">Unlock Premium</button>`}
      ${d.isNew ? '' : '<button class="btn danger" style="width:100%;margin-top:28px" data-act="del-rest">Delete this restaurant</button>'}
    </div>
    <div class="footer-actions">
      <button class="btn" data-act="edit-back">Cancel</button>
      <button class="btn primary" data-act="save-rest">Save</button>
    </div>
  </div>`;
}

/* ============ render ============ */
let lastView = null;
function render(){
  const v = { pick: viewPick, bill: viewBill, itemised: viewItemised, edit: viewEdit }[ui.view];
  const old = document.querySelector('.scroll'), top = old ? old.scrollTop : 0;
  document.getElementById('app').innerHTML = v();
  const now = document.querySelector('.scroll');
  if (now && lastView === ui.view) now.scrollTop = top;
  lastView = ui.view;
  if (ui.view === 'bill') fitTotal();
  if (ui.view === 'edit') {
    const all = [...document.querySelectorAll('.screen input[type="text"]')];
    if (all.length) all[all.length - 1].setAttribute('enterkeyhint', 'done');
  }
}

/* slide the add-item drawer up/down without re-rendering (keeps what's typed, and the animation) */
function setDock(open){
  ui.dock = open;
  const dock = document.getElementById('dock'); if (!dock) return;
  dock.classList.toggle('open', open);
  document.getElementById('dock-scrim').classList.toggle('on', open);
  dock.querySelector('#dock-body').toggleAttribute('inert', !open);
  const tab = dock.querySelector('.dock-tab');
  tab.setAttribute('aria-expanded', open);
  const rr = rest();
  tab.querySelector('.lbl').textContent = open ? 'Close' : (rr ? dockTitle(billOf(rr.id)) : 'Menu items');
  if (!open) { if (document.activeElement) document.activeElement.blur(); hideSuggest(); }
  syncKeyboard();
}

/* Chrome keeps the page at full height when the keyboard opens, which would leave the drawer hidden
   underneath it. Measure the keyboard via the visual viewport and lift the drawer by that much. */
function syncKeyboard(){
  const vv = window.visualViewport; if (!vv) return;
  const a = document.activeElement;
  const typing = ui.dock && a && a.closest && a.closest('#dock') && /^(INPUT|TEXTAREA)$/.test(a.tagName);
  const kb = typing ? Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop)) : 0;
  const root = document.documentElement;
  root.style.setProperty('--kb', kb + 'px');
  root.classList.toggle('kb', kb > 0);
}
if (window.visualViewport) {
  visualViewport.addEventListener('resize', syncKeyboard);
  visualViewport.addEventListener('scroll', syncKeyboard);
}
document.addEventListener('focusin', () => setTimeout(syncKeyboard, 0));
document.addEventListener('focusout', () => setTimeout(syncKeyboard, 0));

/* long amounts (e.g. "CHF 1'234.50") get smaller type so the total never pushes the menu button off screen */
function fitTotal(){
  const el = document.getElementById('total'); if (!el) return;
  const box = el.parentElement, lbl = box.querySelector('.lbl');
  const avail = box.clientWidth - (lbl ? lbl.offsetWidth : 0) - 10;
  let size = 50; el.style.fontSize = size + 'px';
  while (el.scrollWidth > avail && size > 22) { size -= 2; el.style.fontSize = size + 'px'; }
}
window.addEventListener('resize', fitTotal);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTotal);

/* ============ the drawer: menu items on this bill, grouped ============ */
const itemKey = e => (e.desc || '').trim().toLowerCase() + '|' + e.price;
const itemName = e => (e.desc || '').trim() || 'Other item';
function itemGroups(b){
  const groups = [], byKey = new Map();
  for (const e of b.extras) {
    const k = itemKey(e);
    let g = byKey.get(k);
    if (!g) { g = { name: itemName(e), price: e.price, qty: 0, lastId: e.id }; byKey.set(k, g); groups.push(g); }
    g.qty++; g.lastId = e.id;
  }
  return groups;
}
const dockTitle = b => 'Menu items' + (b.extras.length ? ' (' + b.extras.length + ')' : '');
function dockItemsHtml(b, r){
  return itemGroups(b).map(g => `<div class="ditem">
      <span class="nm">${g.qty} x ${esc(g.name)}</span>
      <button type="button" class="step" data-act="item-minus" data-id="${g.lastId}" aria-label="Remove one ${esc(g.name)}">\u2212</button>
      <button type="button" class="step" data-act="item-plus" data-id="${g.lastId}" aria-label="Add one more ${esc(g.name)}">+</button>
      <span class="amt">${money(g.price * g.qty, r)}</span>
    </div>`).join('');
}
function refreshDockItems(){
  const r = rest(); if (!r) return;
  const b = billOf(r.id);
  const box = document.getElementById('dock-items'); if (box) box.innerHTML = dockItemsHtml(b, r);
  const lbl = document.querySelector('#dock .dock-tab .lbl'); if (lbl && !ui.dock) lbl.textContent = dockTitle(b);   // the handle shows the count while closed
}

/* in-place update so taps feel instant */
function refreshTotal(){
  const el = document.getElementById('total'); if (!el) return;
  el.textContent = money(totalOf(rest()));
  fitTotal();
  el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
}
function refreshPlate(id){
  const r = rest(), n = billOf(r.id).counts[id] || 0;
  const plate = document.querySelector(`[data-plate="${id}"]`); if (!plate) return;
  const num = plate.querySelector('.n');
  num.textContent = n; num.classList.toggle('zero', !n);
  plate.parentElement.classList.toggle('has', n > 0);
  plate.classList.remove('pop'); void plate.offsetWidth; plate.classList.add('pop');
}

/* ============ editing helpers ============ */
function startDraft(id){
  const r = S.restaurants.find(x => x.id === id);
  ui.draft = r
    ? { id: r.id, isNew: false, name: r.name, currency: curOf(r),
      plates: r.plates.map(p => ({ id: p.id, colour: p.colour, price: plain(p.price, curOf(r)) })),
      items: (r.items || []).map(it => ({ id: it.id, desc: it.desc, price: plain(it.price, curOf(r)) })) }
    : { id: uid(), isNew: true, name: '', currency: (isPremium() && S.lastCurrency) || defaultCurrency(),
      plates: [{ id: uid(), colour: SWATCHES[0], price: '' }], items: [] };
  ui.prevView = ui.view;
  go('edit');
}
function saveDraft(){
  const d = ui.draft;
  if (!d.name.trim()) { alert('Give the restaurant a name.'); return; }
  if (d.isNew && !isPremium() && S.restaurants.length >= FREE_RESTAURANTS) { showUpgrade('restaurants'); return; }
  const plates = [];
  for (const p of d.plates) {
    if (p.price.trim() === '') continue;               // ignore blank rows
    const c = toCents(p.price, d.currency);
    if (c === null) { alert('One of the plate prices is not a valid number.'); return; }
    plates.push({ id: p.id, colour: p.colour, price: c });
  }
  if (!plates.length) { alert('Add at least one plate with a price.'); return; }
  const items = [];
  for (const it of d.items) {
    const desc = it.desc.trim(), pr = it.price.trim();
    if (!desc && !pr) continue;
    if (!desc) { alert('Each menu item needs a description.'); return; }
    const c = toCents(pr, d.currency);
    if (c === null) { alert(`"${desc}" needs a valid price.`); return; }
    items.push({ id: it.id, desc, price: c });
  }
  const rec = { id: d.id, name: d.name.trim(), currency: d.currency, plates, items };
  S.lastCurrency = d.currency;   // the next new restaurant starts with the same currency
  const i = S.restaurants.findIndex(r => r.id === d.id);
  if (i >= 0) S.restaurants[i] = rec; else S.restaurants.push(rec);
  // tidy counts for plates that no longer exist
  const b = S.bills[d.id];
  if (b) for (const k of Object.keys(b.counts)) if (!plates.some(p => p.id === k)) delete b.counts[k];
  persist();
  ui.draft = null;
  if (d.isNew) { S.current = d.id; persist(); go('bill'); }
  else go(S.current === d.id ? 'bill' : 'pick');
}

/* ============ events ============ */
document.addEventListener('click', e => {
  // anywhere on the collapsed drawer opens it (the name and the tab also toggle it, via data-act)
  const dock = e.target.closest('#dock');
  if (dock && !ui.dock && !e.target.closest('[data-act="dock-toggle"]')) { setDock(true); return; }
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  switch (act) {
    case 'open': {
      const r = S.restaurants.find(x => x.id === id);
      if (!r || (!isPremium() && S.restaurants.indexOf(r) >= FREE_RESTAURANTS)) { showUpgrade('restaurants'); break; }
      S.current = id; persist(); go('bill'); break;
    }
    case 'pick': go('pick'); break;
    case 'bill': go('bill'); break;
    case 'new':
      if (!isPremium() && S.restaurants.length >= FREE_RESTAURANTS) { if (ui.menu) { ui.menu = false; render(); } showUpgrade('restaurants'); break; }
      startDraft(null); break;
    case 'edit': startDraft(id); break;
    case 'edit-back': ui.draft = null; go(ui.prevView === 'bill' && rest() ? 'bill' : 'pick'); break;
    case 'dock-toggle': setDock(!ui.dock); break;
    case 'dock-close': setDock(false); break;
    case 'upsell': if (ui.menu) { ui.menu = false; render(); } showUpgrade(t.dataset.why); break;
    case 'up-close': hideUpgrade(); break;
    case 'up-buy': buyPremium(); break;
    case 'up-restore': restorePurchase(); break;
    case 'menu': ui.menu = true; render(); break;
    case 'menu-close': ui.menu = false; render(); break;
    case 'itemised': go('itemised'); break;
    case 'start-remove': ui.menu = false; ui.removing = true; render(); break;
    case 'cancel-remove': ui.removing = false; render(); break;
    case 'reset':
      if (confirm('Clear all plates and items and start a new bill?')) { S.bills[S.current] = { counts: {}, extras: [] }; persist(); go('bill'); }
      else { ui.menu = false; render(); }
      break;
    case 'plate': {
      if (Date.now() < lp.suppressUntil) break;   // this click is just the end of a long press
      const r = rest(), b = billOf(r.id);
      if (ui.removing) {   // stays in remove mode until Done, so several plates can be removed one by one
        if (!(b.counts[id] > 0)) return;
        b.counts[id]--; persist(); refreshPlate(id); refreshTotal();
        if (navigator.vibrate) navigator.vibrate(8);
        if (!r.plates.some(p => (b.counts[p.id] || 0) > 0)) { ui.removing = false; render(); refreshTotal(); toast('All plates removed'); }
      } else {
        b.counts[id] = (b.counts[id] || 0) + 1; persist();
        refreshPlate(id); refreshTotal();
        if (navigator.vibrate) navigator.vibrate(8);
      }
      break;
    }
    case 'add-plate-modal':
      if (!isPremium() && rest().plates.length >= FREE_PLATES) { showUpgrade('plates'); break; }
      openAddPlate(); break;
    case 'np-save': saveNewPlate(); break;
    case 'm-close': hideModal(); break;
    case 'm-remove': {
      const r = rest(), b = billOf(r.id);
      hideModal();
      if (b.counts[id] > 0) { b.counts[id]--; persist(); refreshPlate(id); refreshTotal(); toast('Removed one plate'); }
      break;
    }
    case 'edit-colour': {
      const i = +t.dataset.i; ccInit(ui.draft.plates[i].colour);
      showModal(`<h2>Plate colour</h2>
        <p class="m-sub">Pick a colour, or tap the rainbow circle to mix your own starting from it.</p>
        <div class="m-preview"><div class="plate" data-cc-preview style="--c:${CC.value};--ink:${inkFor(CC.value)}"><span class="n zero">0</span></div></div>
        ${ccHtml()}
        <div class="m-row"><button class="btn" data-act="m-close">Cancel</button><button class="btn primary" data-act="cc-apply" data-i="${i}">Use colour</button></div>`);
      ccRefresh(); break;
    }
    case 'cc-pick': CC.value = t.dataset.c; CC.custom = false; ccRefresh(); break;
    case 'cc-custom': CC.custom = true; ccRefresh(); break;
    case 'cc-apply': {
      const i = +t.dataset.i; ui.draft.plates[i].colour = CC.value; hideModal();
      const dot = document.querySelector(`.cdot[data-i="${i}"]`); if (dot) dot.style.setProperty('--c', CC.value);
      break;
    }
    case 'item-plus': {   // one more of this item (the drawer stays open, no message)
      const b = billOf(S.current), src = b.extras.find(x => x.id === id); if (!src) break;
      b.extras.push({ id: uid(), price: src.price, desc: src.desc });
      persist(); refreshDockItems(); refreshTotal(); break;
    }
    case 'item-minus': {  // one fewer; removing the last one says so
      const b = billOf(S.current), i = b.extras.findIndex(x => x.id === id); if (i < 0) break;
      const gone = b.extras[i], left = b.extras.filter(x => itemKey(x) === itemKey(gone)).length;
      b.extras.splice(i, 1);
      persist(); refreshDockItems(); refreshTotal();
      if (left === 1) toast(itemName(gone) + ' removed');
      break;
    }
    case 'del-extra': {
      const b = billOf(S.current); b.extras = b.extras.filter(x => x.id !== id); persist(); render(); break;
    }
    case 'add-plate':
      if (!isPremium() && ui.draft.plates.length >= FREE_PLATES) { showUpgrade('plates'); break; }
      ui.draft.plates.push({ id: uid(), colour: SWATCHES[ui.draft.plates.length % SWATCHES.length], price: '' });
      render();
      { const inputs = document.querySelectorAll('[data-field="price"]'); inputs[inputs.length - 1]?.focus(); }
      break;
    case 'add-item':
      ui.draft.items.push({ id: uid(), desc: '', price: '' });
      render();
      { const f = document.querySelectorAll('[data-field="idesc"]'); f[f.length - 1]?.focus(); }
      break;
    case 'del-item': ui.draft.items.splice(+t.dataset.i, 1); render(); break;
    case 'pick-other': {
      if (ui.view === 'edit') {
        const i = +t.dataset.i;
        ui.draft.items[i].desc = t.dataset.desc;
        document.querySelector(`[data-field="idesc"][data-i="${i}"]`).value = t.dataset.desc;
        hideEditSuggest();
        document.querySelector(`[data-field="iprice"][data-i="${i}"]`).focus();
      } else {
        document.getElementById('xdesc').value = t.dataset.desc;
        hideSuggest();
        document.getElementById('xprice').focus();   // no price is filled in: it differs between restaurants
      }
      break;
    }
    case 'pick-item': {
      const it = (rest().items || []).find(x => x.id === id); if (!it) break;
      document.getElementById('xdesc').value = it.desc;
      document.getElementById('xprice').value = plain(it.price, curOf(rest()));
      hideSuggest(); document.getElementById('xdesc').blur();
      break;
    }
    case 'del-plate': ui.draft.plates.splice(+t.dataset.i, 1); render(); break;
    case 'save-rest': saveDraft(); break;
    case 'del-rest':
      if (confirm(`Delete ${ui.draft.name || 'this restaurant'} and its current bill?`)) {
        S.restaurants = S.restaurants.filter(r => r.id !== ui.draft.id);
        delete S.bills[ui.draft.id];
        if (S.current === ui.draft.id) S.current = null;
        persist(); ui.draft = null; go('pick');
      }
      break;
  }
});

/* landing page pick list */
document.addEventListener('change', e => {
  if (e.target.id === 'cur-select' && ui.draft) {
    const from = ui.draft.currency, to = e.target.value;
    const conv = x => { const c = x.price.trim() ? toCents(x.price, from) : null; if (c !== null) x.price = plain(c, to); };
    ui.draft.plates.forEach(conv); ui.draft.items.forEach(conv);
    ui.draft.currency = to; render(); return;
  }
  if (e.target.id !== 'rest-select') return;
  const v = e.target.value;
  if (v === '__new') startDraft(null);
  else if (S.restaurants.some(r => r.id === v)) { S.current = v; persist(); go('bill'); }
});

/* editor inputs: update draft without re-rendering (keeps keyboard open) */
document.addEventListener('input', e => {
  if (e.target.id === 'xdesc') { showSuggest(); return; }
  if (e.target.id === 'cc-h' || e.target.id === 'cc-s' || e.target.id === 'cc-l') {
    CC.value = hslToHex(+document.getElementById('cc-h').value, +document.getElementById('cc-s').value, +document.getElementById('cc-l').value);
    CC.custom = true; ccRefresh('hsl'); return;
  }
  if (e.target.id === 'cc-hex') {
    let v = e.target.value.trim(); if (v && v[0] !== '#') v = '#' + v;
    if (/^#[0-9a-f]{6}$/i.test(v)) { CC.value = v.toLowerCase(); CC.custom = true; ccRefresh('hex'); }
    return;
  }
  const f = e.target.dataset.field; if (!f || !ui.draft) return;
  const i = +e.target.dataset.i, v = e.target.value;
  if (f === 'name') ui.draft.name = v;
  else if (f === 'idesc') { ui.draft.items[i].desc = v; showEditSuggest(e.target); }
  else if (f === 'iprice') ui.draft.items[i].price = v;
  else ui.draft.plates[i][f] = v;
});

/* add non-plate item */
document.addEventListener('submit', e => {
  if (e.target.id !== 'extra-form') return;
  e.preventDefault();
  const priceEl = document.getElementById('xprice'), descEl = document.getElementById('xdesc');
  const c = toCents(priceEl.value, curOf(rest()));
  if (c === null || c === 0) { priceEl.focus(); priceEl.style.borderColor = 'var(--danger)'; return; }
  const desc = descEl.value.trim(), r = rest();
  billOf(r.id).extras.push({ id: uid(), price: c, desc });
  // Premium: a new description is remembered on this restaurant's menu, or its saved price updated (quietly)
  if (isPremium() && desc) {
    r.items ||= [];
    const existing = r.items.find(i => i.desc.toLowerCase() === desc.toLowerCase());
    if (!existing) r.items.push({ id: uid(), desc, price: c });
    else if (existing.price !== c) existing.price = c;
  }
  persist();
  priceEl.value = ''; descEl.value = ''; priceEl.style.borderColor = '';
  setDock(false);
  refreshDockItems();
  refreshTotal();
  toast((desc || 'Other item') + ' added');
});

/* ---- suggestions for the description field ---- */
/* descriptions of items on OTHER restaurants' menus (not already on this one), matching what has been typed */
function otherItems(excludeRestId, takenDescs, q){
  const seen = new Set(takenDescs.map(d => d.toLowerCase()));
  const out = [];
  for (const r of S.restaurants) {
    if (r.id === excludeRestId) continue;
    for (const it of (r.items || [])) {
      const k = it.desc.toLowerCase();
      if (seen.has(k) || (q && !k.includes(q))) continue;
      seen.add(k); out.push(it.desc);
    }
  }
  return out.sort((a, b) => a.localeCompare(b));
}
function showSuggest(){
  const box = document.getElementById('suggest'), input = document.getElementById('xdesc');
  if (!box || !input) return;
  if (!isPremium()) {   // free: no saved items, just a nudge while the box is empty
    const typed = input.value.trim();
    box.innerHTML = typed ? '' : '<button type="button" data-act="upsell" data-why="items"><span>Save items for next time</span><small class="pro-note">Premium</small></button>';
    box.hidden = !!typed;
    return;
  }
  const items = rest().items || [], raw = input.value.trim(), q = raw.toLowerCase();
  const mine = items.filter(i => i.desc.toLowerCase().includes(q));
  // items from other restaurants are offered too (on focus, and narrowed as you type); they never bring a price with them
  const others = otherItems(S.current, items.map(i => i.desc), q).slice(0, q ? 8 : 6);
  const exact = items.some(i => i.desc.toLowerCase() === q);
  let html = mine.map(i => `<button type="button" data-act="pick-item" data-id="${i.id}"><span>${esc(i.desc)}</span><b>${money(i.price)}</b></button>`).join('');
  html += others.map(d => `<button type="button" data-act="pick-other" data-desc="${esc(d)}"><span>${esc(d)}</span><small>other menu</small></button>`).join('');
  if (raw && !exact && !mine.length && !others.length) html += `<div class="hint">"${esc(raw)}" isn't on this menu yet. It will be saved here when you add it.</div>`;
  box.innerHTML = html;
  box.hidden = !html;
}
function hideEditSuggest(){ document.querySelectorAll('.edit-suggest').forEach(b => b.hidden = true); }
function showEditSuggest(input){
  const d = ui.draft; if (!d) return;
  const box = input.parentElement.querySelector('.edit-suggest'); if (!box) return;
  const i = +input.dataset.i, q = input.value.trim().toLowerCase();
  const taken = d.items.filter((_, j) => j !== i).map(x => x.desc.trim()).filter(Boolean);
  const list = otherItems(d.isNew ? null : d.id, taken, q).slice(0, 6);
  if (!list.length) { box.hidden = true; return; }
  box.innerHTML = list.map(t => `<button type="button" data-act="pick-other" data-i="${i}" data-desc="${esc(t)}"><span>${esc(t)}</span><small>other menu</small></button>`).join('');
  // open upwards when there is little room below the field (e.g. the keyboard is up)
  const r = input.getBoundingClientRect(), vvh = window.visualViewport ? window.visualViewport.height : innerHeight;
  const below = vvh - r.bottom, above = r.top;
  box.classList.toggle('up', below < list.length * 46 + 16 && above > below);
  box.hidden = false;
}
function hideSuggest(){ const b = document.getElementById('suggest'); if (b) b.hidden = true; }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('modal')) hideModal();
    else if (document.getElementById('upgrade')) hideUpgrade();
    else if (ui.dock) setDock(false);
    return;
  }
  if (e.key !== 'Enter' || e.isComposing) return;
  const el = e.target;
  if (!el.matches || !el.matches('input[type="text"]')) return;
  if (el.id === 'np-price') { e.preventDefault(); const b = document.querySelector('[data-act="np-save"]'); if (b) b.click(); return; }
  if (el.id === 'cc-hex') { e.preventDefault(); el.blur(); return; }
  if (el.id === 'xdesc') { e.preventDefault(); document.getElementById('xprice').focus(); return; }   // Next: description, then price
  if (ui.view === 'edit') {                                                                           // Next: on to the next box
    e.preventDefault();
    const all = [...document.querySelectorAll('.screen input[type="text"]')].filter(x => !x.disabled && !x.closest('[hidden]'));
    const next = all[all.indexOf(el) + 1];
    if (next) { next.focus(); if (next.scrollIntoView) next.scrollIntoView({ block: 'center', behavior: 'smooth' }); } else el.blur();
  }
});
document.addEventListener('focusin', e => {
  if (e.target.id === 'xdesc') showSuggest();
  else if (e.target.dataset && e.target.dataset.field === 'idesc') showEditSuggest(e.target);
});
document.addEventListener('focusout', e => {
  const el = e.target;
  if (el.matches && el.matches('[data-field="price"],[data-field="iprice"],#xprice,#np-price') && el.value.trim()) {   // 4.8 becomes 4.80
    const inEditor = !!(ui.draft && el.dataset.field), cur = inEditor ? ui.draft.currency : curOf(rest());
    const c = toCents(el.value, cur);
    if (c !== null) {
      el.value = plain(c, cur);
      if (inEditor && el.dataset.field === 'price') ui.draft.plates[+el.dataset.i].price = el.value;
      else if (inEditor && el.dataset.field === 'iprice') ui.draft.items[+el.dataset.i].price = el.value;
    }
  }
  if (el.id === 'xdesc') setTimeout(() => { if (document.activeElement !== el) hideSuggest(); }, 250);
  else if (el.dataset && el.dataset.field === 'idesc') {
    const box = el.parentElement && el.parentElement.querySelector('.edit-suggest');
    setTimeout(() => { if (box && document.activeElement !== el) box.hidden = true; }, 250);
  }
});
document.addEventListener('mousedown', e => { if (e.target.closest('.suggest')) e.preventDefault(); });

function toast(msg){
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  const dock = document.getElementById('dock');
  t.style.bottom = (ui.dock && dock) ? Math.round(window.innerHeight - dock.getBoundingClientRect().top + 46) + 'px' : '';   // clear of the open drawer
  t.textContent = msg; t.className = 'show';
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = '', 2400);
}

render();
refreshEntitlement();   // inside the Play app: ask Google Play whether Premium is owned
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refreshEntitlement(); });

/* ---- installable app: offline support and update prompt ---- */
function showUpdateBanner(){
  if (document.getElementById('update-banner')) return;
  const b = document.createElement('div');
  b.id = 'update-banner'; b.setAttribute('role', 'status');
  b.innerHTML = '<span>New version ready</span><button class="go" type="button">Reload</button><button class="x" type="button" aria-label="Dismiss">×</button>';
  b.querySelector('.go').onclick = () => location.reload();
  b.querySelector('.x').onclick = () => b.remove();
  document.body.appendChild(b);
}
if ('serviceWorker' in navigator) {
  // the service worker reports its version when it activates; if this page is older, offer a reload
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data && e.data.type === 'sw-version' && e.data.version !== BUILD_ID) showUpdateBanner();
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      const check = () => reg.update().catch(() => {});
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
      setInterval(check, 60 * 60 * 1000);
    }).catch(() => {});
  });
}
</script>
